name: Run 01 Forge CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install browser smoke tooling
        run: npm install --no-audit --no-fund
      - name: Install Chromium for smoke
        run: npx playwright install --with-deps chromium
      - name: Run pure JS tests
        run: npm test
      - name: Headless browser smoke (5s per slice)
        run: npm run smoke
      - name: Enforce generation p95 <= 50ms
        run: npm run bench
