<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>A Mão de Deus · Hand of God</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; }
    #game { display: block; width: 100vw; height: 100vh; cursor: none; touch-action: none; }
    #help {
      position: fixed; right: 12px; bottom: 12px; margin: 0; padding: 10px 14px;
      font: 13px/1.5 Georgia, 'Times New Roman', serif; color: #b8b8b8;
      background: rgba(0, 0, 0, 0.55); border-radius: 6px; pointer-events: none;
    }
    #help { transition: opacity 1.2s ease; }
    #help.faded { opacity: 0; }
    @media (max-width: 600px), (max-height: 500px) { #help { font-size: 11px; padding: 6px 10px; left: 12px; right: auto; max-width: 60vw; } }
  </style>
</head>
<body>
  <canvas id="game" aria-label="A Mão de Deus: Hand of God"></canvas>
  <p id="help">← → or A D: walk · Space: jump · Touch: hold the sides to walk, tap the middle to jump<br>M: mute · `: stats</p>
  <script type="module" src="src/main.js"></script>
  <script>
    // The controls hint fades a few seconds after the first input, so it never covers the game on small screens.
    (function () {
      var help = document.getElementById('help');
      var armed = false;
      function arm() {
        if (armed) return;
        armed = true;
        setTimeout(function () { help.classList.add('faded'); }, 5000);
      }
      window.addEventListener('pointerdown', arm, { once: true });
      window.addEventListener('keydown', arm, { once: true });
    })();
  </script>
</body>
</html>
