<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>A Mão de Deus · Hand of God</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; }
    #game { display: block; width: 100vw; height: 100vh; cursor: none; touch-action: none; }
    #help {
      position: fixed; right: 12px; bottom: 12px; margin: 0; padding: 10px 14px;
      font: 13px/1.5 Georgia, 'Times New Roman', serif; color: #b8b8b8;
      background: rgba(0, 0, 0, 0.55); border-radius: 6px; pointer-events: none;
    }
    @media (max-width: 600px) { #help { font-size: 11px; left: 12px; right: auto; } }
  </style>
</head>
<body>
  <canvas id="game" aria-label="A Mão de Deus: Hand of God"></canvas>
  <p id="help">Hold: gather · Release: let go · Second finger / right click: alternate<br>M: mute · `: stats</p>
  <script type="module" src="src/main.js"></script>
</body>
</html>
